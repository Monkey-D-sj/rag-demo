[project]
name = "rag-demo"
version = "0.1.0"
description = "生产级 RAG 服务"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0",
    "pydantic-settings>=2.0",
    "langchain>=1.3.7",
    "langchain-openai>=1.3.0",
    "langgraph>=1.2.4",
    "openai>=1.0",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "redis>=5.0",
    "tenacity>=8.0",
    "alembic>=1.13",
    "fastapi>=0.138.0",
    "uvicorn[standard]>=0.30",
    "arq>=0.28.0",
    "minio>=7.2.20",
    "pypdf>=6.14.2",
    "langchain-text-splitters>=1.1.2",
    "python-multipart>=0.0.9",
    "langchain-core>=1.4.6",
    "neo4j>=5.28",
]

[project.scripts]
rag-api = "rag.__main__:main"
rag-worker = "rag.worker.main:run"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: 需要 docker compose 起的 pg/redis（默认不跑）",
]

[tool.hatch.build.targets.wheel]
packages = ["rag"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

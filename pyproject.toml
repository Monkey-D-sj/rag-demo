[project]
name = "rag-demo"
version = "0.1.0"
description = "生产级 RAG 服务"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0",
    "pydantic-settings>=2.0",
    "langchain>=1.3.7",
    "langchain-openai>=1.3.0",
    "langgraph>=1.2.4",
    "openai>=1.0",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "redis>=5.0",
    "tenacity>=8.0",
    "alembic>=1.13",
    "fastapi>=0.138.0",
    "uvicorn[standard]>=0.30",
    "aio-pika>=9.5.8",
    "minio>=7.2.20",
    "pypdf>=6.14.2",
    "ragas>=0.2.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "python-multipart>=0.0.9",
    "langchain-core>=1.4.6",
    "neo4j>=5.28",
    "langfuse>=3.0,<5.0",
    "langchain-community>=0.2,<0.4",
]

[project.scripts]
rag-api = "rag.__main__:main"
rag-worker = "rag.worker.main:run"
rag-eval = "rag.eval.run:main"
rag-eval-answer = "rag.eval.answer_run:main"
rag-eval-suite = "rag.eval.suite_run:main"

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.36.2",
    "locust>=2.45.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not integration and not eval'"
markers = [
    "integration: 需要 docker compose 起的 pg/redis（默认不跑）",
    "eval: 检索或生成评测，需外部模型/数据库（默认不跑）",
]

[tool.hatch.build.targets.wheel]
packages = ["rag"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
